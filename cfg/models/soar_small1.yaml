# SOAR1-s (Small) resolution-preserving segmentation configuration
# Capacity: ~2.1M parameters
# Balanced edge and mobile high-resolution segmentation
nc: 1
channels: 3
scale: s

backbone:
  - [-1, 1, CBA,  [24, 3, 2]]        # 0  stem detail skip  s2
  - [-1, 1, Down, [48]]              # 1  downsample        s4
  - [-1, 1, LKR,  [5, 2.0]]          # 2  P2 (lightweight)  s4
  - [-1, 1, Down, [96]]              # 3  downsample        s8
  - [-1, 2, LKR,  [7, 2.0]]          # 4  P3                s8
  - [-1, 1, Down, [192]]             # 5  downsample        s16
  - [-1, 3, LKR,  [7, 2.0]]          # 6  P4                s16
  - [-1, 1, Down, [384]]             # 7  downsample        s32
  - [-1, 2, LKR,  [7, 2.0]]          # 8  P5                s32
  - [-1, 1, Ctx,  [384]]             # 9  context pooling   s32

decoder:
  - [[-1, 6], 1, Fuse, [192]]        # 10 P5ctx + P4        s16
  - [-1, 1, LKR, [7, 2.0]]           # 11                   s16
  - [[-1, 4], 1, Fuse, [96]]         # 12 + P3              s8
  - [-1, 1, LKR, [7, 2.0]]           # 13                   s8
  - [[-1, 2], 1, Fuse, [48]]         # 14 + P2              s4
  - [[14, 13, 11], 1, Agg, [48]]     # 15 multi-scale agg   s4
  - [[-1, 0], 1, Fuse, [24]]         # 16 + stem detail     s2

head:
  - [-1, 1, SegHead, [24, 2, 0.01]]  # 17 sub-pixel head    s2 -> s1
