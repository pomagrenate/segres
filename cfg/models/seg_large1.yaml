# Large High-Resolution Segmentation Model Configuration
# High-capacity architecture for maximum accuracy

nc: 1  # number of classes
channels: 3  # input channels

# Backbone - Large feature extraction
backbone:
  # [from, n, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0: downsample
  - [-1, 1, Conv, [128, 3, 2]]     # 1: downsample (P2)
  - [-1, 1, Conv, [256, 3, 2]]     # 2: downsample (P3)
  - [-1, 1, Conv, [384, 3, 2]]     # 3: downsample (P4)
  - [-1, 1, Conv, [512, 3, 2]]     # 4: downsample (P5)
  - [-1, 1, SPPF, [512, 5]]        # 5: spatial pyramid pooling

# Neck - Large feature fusion (PANet-style)
neck:
  # Top-down pathway
  - [-1, 1, Upsample, [2, 'nearest']]           # 6: upsample P5
  - [[-1, 3], 1, Concat, [1]]                   # 7: concat P5 + P4
  - [-1, 1, Conv, [384, 1, 1]]                  # 8: reduce channels
  - [-1, 1, Upsample, [2, 'nearest']]           # 9: upsample
  - [[-1, 2], 1, Concat, [1]]                   # 10: concat + P3
  - [-1, 1, Conv, [256, 1, 1]]                  # 11: reduce channels
  - [-1, 1, Upsample, [2, 'nearest']]           # 12: upsample
  - [[-1, 1], 1, Concat, [1]]                   # 13: concat + P2
  - [-1, 1, Conv, [128, 1, 1]]                  # 14: reduce channels
  # Bottom-up pathway
  - [-1, 1, Conv, [128, 3, 2]]                  # 15: downsample
  - [[-1, 11], 1, Concat, [1]]                  # 16: concat + P3_fused
  - [-1, 1, Conv, [256, 1, 1]]                  # 17: reduce channels
  - [-1, 1, Conv, [256, 3, 2]]                  # 18: downsample
  - [[-1, 8], 1, Concat, [1]]                    # 19: concat + P4_fused
  - [-1, 1, Conv, [384, 1, 1]]                  # 20: reduce channels

# Head - Large segmentation head
head:
  # Feature refinement and upsampling to original resolution
  - [-1, 1, Conv, [32, 1, 1]]                   # 21: reduce channels
  - [-1, 1, Conv, [32, 3, 1]]                   # 22: refine features
  - [-1, 1, Upsample, [2, 'bilinear']]          # 23: upsample
  - [-1, 1, Conv, [32, 3, 1]]                   # 24: refine
  - [-1, 1, Upsample, [2, 'bilinear']]          # 25: upsample
  - [-1, 1, nn.Conv2d, [1, 1, 1]]              # 26: final mask output
