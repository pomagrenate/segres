# Small High-Resolution Segmentation Model Configuration
# Balanced architecture for good accuracy and speed

nc: 1  # number of classes
channels: 3  # input channels

# Backbone - Small feature extraction
backbone:
  # [from, n, module, args]
  - [-1, 1, Conv, [24, 3, 2]]      # 0: downsample
  - [-1, 1, Conv, [48, 3, 2]]      # 1: downsample (P2)
  - [-1, 1, Conv, [96, 3, 2]]      # 2: downsample (P3)
  - [-1, 1, Conv, [160, 3, 2]]     # 3: downsample (P4)
  - [-1, 1, SPPF, [160, 5]]        # 4: spatial pyramid pooling

# Neck - Small feature fusion
neck:
  # Top-down pathway
  - [-1, 1, Upsample, [2, 'nearest']]           # 5: upsample P4
  - [[-1, 2], 1, Concat, [1]]                   # 6: concat P4 + P3
  - [-1, 1, Conv, [96, 1, 1]]                   # 7: reduce channels
  - [-1, 1, Upsample, [2, 'nearest']]           # 8: upsample
  - [[-1, 1], 1, Concat, [1]]                   # 9: concat + P2
  - [-1, 1, Conv, [48, 1, 1]]                   # 10: reduce channels
  # Bottom-up pathway
  - [-1, 1, Conv, [48, 3, 2]]                   # 11: downsample
  - [[-1, 6], 1, Concat, [1]]                   # 12: concat + P3_fused
  - [-1, 1, Conv, [96, 1, 1]]                   # 13: reduce channels

# Head - Small segmentation head
head:
  # Feature refinement and upsampling
  - [-1, 1, Conv, [16, 1, 1]]                   # 14: reduce channels
  - [-1, 1, Conv, [16, 3, 1]]                   # 15: refine features
  - [-1, 1, Upsample, [2, 'bilinear']]          # 16: upsample
  - [-1, 1, Upsample, [2, 'bilinear']]          # 17: upsample
  - [-1, 1, Upsample, [2, 'bilinear']]          # 18: upsample
  - [-1, 1, nn.Conv2d, [1, 1, 1]]              # 19: final mask output
