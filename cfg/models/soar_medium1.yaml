# SOAR1-m (Medium) resolution-preserving segmentation configuration
# Capacity: ~5.6M parameters
# General-purpose scientific baseline architecture
nc: 1
channels: 3
scale: m

backbone:
  - [-1, 1, CBA,  [32, 3, 2]]        # 0  stem detail skip  s2
  - [-1, 1, Down, [64]]              # 1  downsample        s4
  - [-1, 2, LKR,  [5, 2.0]]          # 2  P2                s4
  - [-1, 1, Down, [128]]             # 3  downsample        s8
  - [-1, 3, LKR,  [7, 2.0]]          # 4  P3                s8
  - [-1, 1, Down, [256]]             # 5  downsample        s16
  - [-1, 5, LKR,  [7, 2.0]]          # 6  P4 (workhorse)    s16
  - [-1, 1, Down, [512]]             # 7  downsample        s32
  - [-1, 3, LKR,  [7, 2.0]]          # 8  P5                s32
  - [-1, 1, Ctx,  [512]]             # 9  context pooling   s32

decoder:
  - [[-1, 6], 1, Fuse, [256]]        # 10 P5ctx + P4        s16
  - [-1, 1, LKR, [7, 2.0]]           # 11                   s16
  - [[-1, 4], 1, Fuse, [128]]        # 12 + P3              s8
  - [-1, 1, LKR, [7, 2.0]]           # 13                   s8
  - [[-1, 2], 1, Fuse, [64]]         # 14 + P2              s4
  - [[14, 13, 11], 1, Agg, [64]]     # 15 multi-scale agg   s4
  - [[-1, 0], 1, Fuse, [32]]         # 16 + stem detail     s2

head:
  - [-1, 1, SegHead, [32, 2, 0.01]]  # 17 sub-pixel head    s2 -> s1
