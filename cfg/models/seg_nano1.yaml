# Lightweight High-Resolution Segmentation Model Configuration
# Simplified architecture for faster training and inference

nc: 1  # number of classes
channels: 3  # input channels

# Backbone - Lightweight feature extraction
backbone:
  # [from, n, module, args]
  [-1, 1, Conv, [16, 3, 2]]      # 0: downsample
  [-1, 1, Conv, [32, 3, 2]]      # 1: downsample (P2)
  [-1, 1, Conv, [64, 3, 2]]      # 2: downsample (P3)
  [-1, 1, Conv, [128, 3, 2]]     # 3: downsample (P4)
  [-1, 1, SPPF, [128, 5]]        # 4: spatial pyramid pooling

# Neck - Lightweight feature fusion
neck:
  # Top-down pathway
  [-1, 1, Upsample, [2, 'nearest']]           # 5: upsample P4
  [[-1, 2], 1, Conv, [64, 1, 1]]              # 6: concat P4 + P3, reduce
  [-1, 1, Upsample, [2, 'nearest']]           # 7: upsample
  [[-1, 1], 1, Conv, [32, 1, 1]]              # 8: concat + P2, reduce
  
  # Bottom-up pathway
  [-1, 1, Conv, [32, 3, 2]]                   # 9: downsample
  [[-1, 6], 1, Conv, [64, 1, 1]]             # 10: concat + P3_fused

# Head - Lightweight segmentation head
head:
  # Feature refinement and upsampling
  [-1, 1, Conv, [16, 1, 1]]                   # 11: reduce channels
  [-1, 1, Upsample, [2, 'bilinear']]          # 12: upsample
  [-1, 1, Upsample, [2, 'bilinear']]          # 13: upsample
  [-1, 1, nn.Conv2d, [1, 1, 1]]              # 14: final mask output
