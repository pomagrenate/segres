# SOAR1-l (Large) resolution-preserving segmentation configuration
# Capacity: ~11.5M parameters
# High-capacity model with conservative high-resolution stages and deep low-resolution workhorse
nc: 1
channels: 3
scale: l

backbone:
  - [-1, 1, CBA,  [32, 3, 2]]        # 0  stem detail skip  s2 (memory-capped)
  - [-1, 1, Down, [64]]              # 1  downsample        s4
  - [-1, 2, LKR,  [5, 2.0]]          # 2  P2                s4 (conservative)
  - [-1, 1, Down, [160]]             # 3  downsample        s8
  - [-1, 3, LKR,  [7, 2.0]]          # 4  P3                s8
  - [-1, 1, Down, [320]]             # 5  downsample        s16
  - [-1, 7, LKR,  [7, 2.0]]          # 6  P4 (deep engine)  s16
  - [-1, 1, Down, [640]]             # 7  downsample        s32
  - [-1, 4, LKR,  [7, 2.0]]          # 8  P5 (high cap)     s32
  - [-1, 1, Ctx,  [640]]             # 9  context pooling   s32

decoder:
  - [[-1, 6], 1, Fuse, [320]]        # 10 P5ctx + P4        s16
  - [-1, 2, LKR, [7, 2.0]]           # 11                   s16
  - [[-1, 4], 1, Fuse, [160]]        # 12 + P3              s8
  - [-1, 1, LKR, [7, 2.0]]           # 13                   s8
  - [[-1, 2], 1, Fuse, [64]]         # 14 + P2              s4
  - [[14, 13, 11], 1, Agg, [64]]     # 15 multi-scale agg   s4
  - [[-1, 0], 1, Fuse, [32]]         # 16 + stem detail     s2

head:
  - [-1, 1, SegHead, [32, 2, 0.01]]  # 17 sub-pixel head    s2 -> s1
